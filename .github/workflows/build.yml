name: Release-β

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  # ==========================================
  # 新增：前置源码准备任务
  # ==========================================
  prepare-sources:
    name: Prepare Sources
    runs-on: ubuntu-latest
    steps:
      - name: Download musl source
        run: |
          mkdir -p shared-tarballs
          echo "Downloading musl-1.2.6.tar.gz..."
          # 增加重试机制下载一次 musl 源码
          curl -fsSL --retry 10 --retry-delay 5 https://musl.libc.org/releases/musl-1.2.6.tar.gz -o shared-tarballs/musl-1.2.6.tar.gz
          
          # 提示：如果未来遇到 gcc, binutils 等其他包并发下载失败，也可直接在这里追加 curl 下载命令
          # curl -fsSL --retry 10 ... -o shared-tarballs/gcc-x.y.z.tar.xz

      - name: Upload sources artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-tarballs
          path: shared-tarballs/
          retention-days: 1 # 仅在本次工作流运行期间短暂停留即可

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    needs: prepare-sources # 强依赖：等待源码下载完成才开始矩阵构建
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - i586-unknown-linux-musl
          - i686-unknown-linux-musl
          - loongarch64-unknown-linux-musl
          - m68k-unknown-linux-musl
          - microblazeel-xilinx-linux-musl
          - microblaze-xilinx-linux-musl
          - mipsel-unknown-linux-musl
          - mipsel-unknown-linux-muslsf
          - mips-unknown-linux-musl
          - mips-unknown-linux-muslsf
          - mips64el-unknown-linux-musl
          - mips64-unknown-linux-musl
          - or1k-unknown-linux-musl
          - powerpcle-unknown-linux-musl
          - powerpc-unknown-linux-musl
          - powerpc64le-unknown-linux-musl
          - powerpc64-unknown-linux-musl
          - riscv32-unknown-linux-musl
          - riscv64-unknown-linux-musl
          - s390x-ibm-linux-musl
          - sh4-multilib-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      # ==========================================
      # 新增：拉取共享源码并部署到 ct-ng 可以识别的位置
      # ==========================================
      - name: Download shared sources
        uses: actions/download-artifact@v4
        with:
          name: shared-tarballs
          path: shared-tarballs

      - name: Setup local tarballs directory
        run: |
          # crosstool-NG 默认通常会在用户目录下的 src 找预下载的压缩包
          mkdir -p ~/src
          cp shared-tarballs/* ~/src/ 2>/dev/null || true
          
          # 双重保障：也放到当前工作区的默认缓存路径中
          mkdir -p .build/tarballs
          cp shared-tarballs/* .build/tarballs/ 2>/dev/null || true

      - name: Build
        run: |
          sudo rm -rf /opt/*
          
          # 通过显式导出环境变量，强制 crosstool-NG 优先使用我们注入的本地源码包目录
          export CT_LOCAL_TARBALLS_DIR="${GITHUB_WORKSPACE}/shared-tarballs"
          
          ./scripts/make ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.xz
          path: ${{ matrix.target }}.tar.xz
          if-no-files-found: error
          retention-days: 1
          
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.xz.sha256
          path: ${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs:
      - build
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          # 仅匹配 .tar.xz 及其 sha256 产物，这也会忽略掉名为 shared-tarballs 的前置源码 artifact
          pattern: "*.tar.*"
          merge-multiple: true
      - name: Generate checksums
        run: |
          echo "| Filename | Sha256sum |" > RELEASE.md
          echo "| -------- | --------- |" >> RELEASE.md
          for i in release/*.sha256; do
            echo "| $(basename $i .sha256) | $(cat $i) |" >> RELEASE.md
          done
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/*.tar.xz; do
            gh release upload ${{ github.event.release.tag_name }} $i $i.sha256
          done
          gh release edit ${{ github.event.release.tag_name }} -F RELEASE.md