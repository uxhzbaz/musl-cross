name: Release-α

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签🏷 (例如 v1.0.0)'
        required: true
      release_name:
        description: '发布名称 (例如 1.0.0)'
        required: true
  release:
    types: [published]

env:
  MUSL_VERSION: "1.2.6"
  ARTIFACT_RETENTION: 1

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        run: |
          mkdir -p shared-tarballs
          curl -fsSL --retry 10 --retry-delay 5 \
            https://musl.libc.org/releases/musl-${MUSL_VERSION}.tar.gz \
            -o shared-tarballs/musl-${MUSL_VERSION}.tar.gz

          MOLD_VERSION=$(curl -fsSL https://api.github.com/repos/rui314/mold/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "MOLD_VERSION=${MOLD_VERSION}" > shared-tarballs/mold.env
          curl -fsSL --retry 5 \
            "https://github.com/rui314/mold/archive/refs/tags/v${MOLD_VERSION}.tar.gz" \
            -o shared-tarballs/mold-${MOLD_VERSION}.tar.gz

      - name: Patch musl (drop faccessat2 to avoid Android seccomp SIGSYS)
        run: |
          mkdir -p musl-patch-root
          tar -xf shared-tarballs/musl-${MUSL_VERSION}.tar.gz -C musl-patch-root
          # 此时目录结构为 musl-patch-root/musl-${MUSL_VERSION}/...

          find "musl-patch-root/musl-${MUSL_VERSION}/arch" -name 'syscall.h.in' -print0 | \
            xargs -0 sed -i '/#define[[:space:]]\+__NR_faccessat2[[:space:]]/d'

          if grep -rl '__NR_faccessat2' "musl-patch-root/musl-${MUSL_VERSION}/arch"; then
            echo "::error::faccessat2 patch 未生效"
            exit 1
          fi

          # 保留原始顶层目录名重新打包，确保 crosstool-NG 解压后目录结构不变
          tar -C musl-patch-root -czf "shared-tarballs/musl-${MUSL_VERSION}.tar.gz" "musl-${MUSL_VERSION}"
          echo "已重新打包 patched musl-${MUSL_VERSION}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: shared-tarballs
          path: shared-tarballs/
          retention-days: ${{ env.ARTIFACT_RETENTION }}

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - i686-unknown-linux-musl
          - arm-unknown-linux-musleabi
    env:
      TARGET: ${{ matrix.target }}
      CT_LOCAL_TARBALLS_DIR: ${{ github.workspace }}/shared-tarballs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: shared-tarballs
          path: shared-tarballs

      - name: Deploy tarballs
        run: |
          mkdir -p ~/src .build/tarballs
          cp shared-tarballs/musl-*.tar.gz ~/src/
          cp shared-tarballs/musl-*.tar.gz .build/tarballs/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake bison bzip2 ca-certificates cmake curl file flex \
            g++ gawk gdb git gperf help2man libncurses-dev libssl-dev \
            libtool-bin make patch pkg-config python3 rsync texinfo \
            unzip wget xz-utils \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            zlib1g-dev libzstd-dev \
            clang libstdc++-12-dev

      - name: Build static mold
        run: |
          source shared-tarballs/mold.env
          tar -xf shared-tarballs/mold-${MOLD_VERSION}.tar.gz
          cd mold-${MOLD_VERSION}
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMOLD_MOSTLY_STATIC=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_INSTALL_PREFIX=/tmp/mold-static
          cmake --build build -j$(nproc)
          cmake --install build
          file /tmp/mold-static/bin/mold

      - name: Build toolchain
        run: |
          sudo rm -rf /opt/*
          sudo mkdir -p /opt
          sudo chmod 0777 /opt

          pushd builder
          git reset --hard HEAD
          git clean -fd
          for patch in ../targets/${TARGET}/*.patch; do
            [ -f "$patch" ] && patch -Np1 -i "$patch"
          done
          ./bootstrap
          ./configure --prefix=/opt/ct-ng
          make -j$(nproc)
          sudo make install
          popd

          rm -rf build
          mkdir -p build
          cp targets/${TARGET}/config build/.config
          printf '\nCT_STATIC_TOOLCHAIN=y\nCT_CC_GCC_STATIC_LIBSTDCXX=y\n' >> build/.config

          pushd build
          /opt/ct-ng/bin/ct-ng olddefconfig
          /opt/ct-ng/bin/ct-ng build
          popd

          MOLD_BIN=$(find /opt/x-tools/${TARGET} -name "mold" -type f 2>/dev/null | head -1)
          if [ -n "${MOLD_BIN}" ]; then
            echo "Replacing mold: ${MOLD_BIN}"
            sudo cp /tmp/mold-static/bin/mold "${MOLD_BIN}"
            file "${MOLD_BIN}"
          else
            echo "mold not found in ${TARGET}, skipping"
          fi

      - name: Strip debug symbols
        run: |
          find /opt/x-tools/${TARGET} -type f | while read f; do
            case $(file -b "$f") in
              ELF*static*not\ stripped)
                sudo strip --strip-debug "$f" && echo "stripped: $f"
                ;;
            esac
          done

      - name: Package
        run: |
          sudo mv /opt/x-tools/${TARGET} .
          sudo chown -R root:root ${TARGET}
          sudo tar -cJvf ${TARGET}.tar.xz ${TARGET}
          sudo sha256sum ${TARGET}.tar.xz | awk '{ print $1 }' > ${TARGET}.tar.xz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.xz
          path: ${{ matrix.target }}.tar.xz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.xz.sha256
          path: ${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION }}

  release:
    name: Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "*.tar.*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          {
            echo "| Filename | Sha256sum |"
            echo "| -------- | --------- |"
            for f in release/*.sha256; do
              echo "| $(basename "$f" .sha256) | $(cat "$f") |"
            done
          } > RELEASE.md

      - name: Create or use release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            NAME="${{ github.event.inputs.release_name }}"
            gh release create "${TAG}" \
              --title "${NAME}" \
              --notes-file RELEASE.md
          else
            TAG="${{ github.event.release.tag_name }}"
            gh release edit "${TAG}" -F RELEASE.md
          fi

          for f in release/*.tar.xz; do
            gh release upload "${TAG}" "$f" "$f.sha256"
          done
